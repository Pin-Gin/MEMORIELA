name: YURA Visual Master Bridge

on:
  push:
    branches:
      - main
    paths:
      - docs/assistant-context/creation/yura/identity/master/VISUAL_MASTER.png
      - scripts/tools/visual/Build-YuraVisualMasterBridge.py
      - .github/workflows/yura-visual-master-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yura-visual-master-bridge
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bridge dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Build bridge from canonical MASTER
        run: python scripts/tools/visual/Build-YuraVisualMasterBridge.py

      - name: Verify bridge hashes and decodeability
        run: python scripts/tools/visual/Build-YuraVisualMasterBridge.py --verify-only

      - name: Commit refreshed bridge if changed
        shell: bash
        run: |
          set -euo pipefail
          git add docs/assistant-context/creation/yura/identity/master/bridge
          if git diff --cached --quiet; then
            echo "Bridge is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh YURA visual master bridge"
          git push
